<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <defs>
    <style>
      .logo-text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 36px; fill: #0F1B2D; letter-spacing: 3px; }
      .logo-sub { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 600; font-size: 10.5px; fill: #0F1B2D; letter-spacing: 8.5px; }
    </style>
  </defs>
  <text x="0" y="34" class="logo-text">ADVERTEX</text>
  <!-- Blue diagonal slash through the X -->
  <line x1="224" y1="34" x2="248" y2="6" stroke="#1B6FEF" stroke-width="3.5" stroke-linecap="round"/>
  <text x="2" y="52" class="logo-sub">STUDIO</text>
</svg>

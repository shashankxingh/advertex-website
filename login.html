<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Advertex Studio</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

  <div class="login-container">
    
    <!-- Logo -->
    <a href="/" class="login-logo">
      <svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="28" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">ADVERTE<tspan fill="#FFFFFF">X</tspan></text>
        <path d="M125 32 L145 10" stroke="#1B6FEF" stroke-width="4" stroke-linecap="round"/>
        <text x="2" y="38" font-family="Inter, sans-serif" font-weight="600" font-size="9" fill="#1B6FEF" letter-spacing="4">STUDIO</text>
      </svg>
    </a>

    <!-- Login Card -->
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to access your dashboard</p>

      <!-- Role Selector -->
      <div class="role-selector">
        <button class="role-btn active" data-role="user">Client</button>
        <button class="role-btn" data-role="staff">Staff</button>
        <button class="role-btn" data-role="owner">Owner</button>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="hello@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Keep me logged in</span>
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="login-btn">Sign In &rarr;</button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Google Sign In (Optional/Future) -->
      <button type="button" class="btn btn-outline btn-lg google-btn" style="width: 100%;" id="google-login-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <p class="signup-prompt">
        Don't have an account? <a href="#" id="create-account-link">Create one here</a>
      </p>

    </div>

    <div class="login-footer">
      <p>&copy; 2026 Advertex Studio. Secure Portal.</p>
    </div>

  </div>

  <!-- Firebase Integration -->
  <script type="module" src="auth.js"></script>
</body>
</html>
